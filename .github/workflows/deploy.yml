name: Build and Deploy Paper to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile LaTeX Document
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          args: "-pdf -bibtex -file-line-error -interaction=nonstopmode"

      - name: Prepare Website Files
        run: |
          mkdir -p public
          cp main.pdf public/main.pdf
          cp main.pdf public/wayclip-paper.pdf
          cp assets/favicon.ico public/favicon.ico
          echo "wayclip.konyogony.dev" > public/CNAME
          cat << 'EOF' > public/index.html
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <link rel="icon" type="image/x-icon" href="favicon.ico">
            <title>Wayclip Design & Architectural Report</title>
            <style>
              html, body, iframe {
                margin: 0;
                padding: 0;
                width: 100%;
                height: 100%;
                border: none;
                overflow: hidden;
              }
            </style>
          </head>
          <body>
            <iframe src="main.pdf" type="application/pdf"></iframe>
          </body>
          </html>
          EOF

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
