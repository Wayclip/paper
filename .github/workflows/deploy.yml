name: Deploy paper to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - name: Compile paper
        uses: xu-cheng/latex-action@v4
        with:
          root_file: main.tex
          extra_system_packages: "inkscape"
          latexmk_shell_escape: true

      - name: Assemble website
        run: |
          mkdir dist
          cp -rL website/. dist/
          cp main.pdf dist/paper.pdf

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
